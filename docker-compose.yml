services:
  postgres:
    image: postgres:16-alpine
    container_name: echogpt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: echogpt
      POSTGRES_PASSWORD: echogpt
      POSTGRES_DB: echogpt
    ports:
      # Bind to loopback only so the database is not exposed on the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U echogpt -d echogpt']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot service: applies migrations and seeds, then exits. Built from the
  # build stage so the dev-only tools (tsx, prisma CLI) used by the seed exist.
  init:
    build:
      context: .
      target: build
    container_name: echogpt-init
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://echogpt:echogpt@postgres:5432/echogpt?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"

  app:
    build:
      context: .
      target: production
    container_name: echogpt-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://echogpt:echogpt@postgres:5432/echogpt?schema=public
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AI_MOCK_MODE: ${AI_MOCK_MODE:-true}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
